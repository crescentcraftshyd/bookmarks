<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrescentCraftsUtilities</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-bookmark"></i> CrescentCraftsUtilities</h1>
            <p>Your all-in-one utility toolkit</p>
        </header>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="cards">Book Mark</button>
            <button class="tab-btn" data-tab="calculator">Calculator</button>
            <button class="tab-btn" data-tab="todo">Todo List</button>
        </div>
        
        <!-- Theme Selector -->
        <div class="theme-selector">
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect">
                <option value="default">Default (Confidence & Trust)</option>
                <option value="flower">Flower Garden</option>
                <option value="season">Seasonal</option>
                <option value="galaxy">Galaxy</option>
                <option value="environment">Environment</option>
            </select>
        </div>

        <!-- Cards Tab -->
        <div id="cardsTab" class="tab-content active">
            <!-- Controls -->
            <div class="controls">
                <div class="control-group">
                    <button id="addBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add New Bookmark
                    </button>
                    <button id="saveConfigBtn" class="btn-secondary">
                        <i class="fas fa-save"></i> Save Config
                    </button>
                    <button id="loadConfigBtn" class="btn-secondary">
                        <i class="fas fa-folder-open"></i> Load Config
                    </button>
                </div>
                
                <div class="pagination-controls">
                    <label for="itemsPerPage">Items per page:</label>
                    <select id="itemsPerPage">
                        <option value="4">4</option>
                        <option value="8" selected>8</option>
                        <option value="12">12</option>
                        <option value="16">16</option>
                    </select>
                    
                    <div class="pagination">
                        <button id="prevPage" class="btn-secondary"><i class="fas fa-chevron-left"></i></button>
                        <span id="pageInfo">Page 1 of 1</span>
                        <button id="nextPage" class="btn-secondary"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>

            <!-- Cards Container -->
            <div id="cardsContainer" class="cards-container">
                <!-- Cards will be dynamically inserted here -->
            </div>
        </div>

        <!-- Calculator Tab -->
        <div id="calculatorTab" class="tab-content">
            <div class="calculator-container">
                <div class="calculator-display">
                    <div class="conversion-display"></div>
                    <div class="main-display">0</div>
                </div>
                <div class="calculator-buttons">
                    <button class="calc-btn calc-function" data-value="C">C</button>
                    <button class="calc-btn calc-function" data-value="CE">CE</button>
                    <button class="calc-btn calc-function" data-value="backspace">⌫</button>
                    <button class="calc-btn calc-operator" data-value="/">÷</button>
                    
                    <button class="calc-btn" data-value="7">7</button>
                    <button class="calc-btn" data-value="8">8</button>
                    <button class="calc-btn" data-value="9">9</button>
                    <button class="calc-btn calc-operator" data-value="*">×</button>
                    
                    <button class="calc-btn" data-value="4">4</button>
                    <button class="calc-btn" data-value="5">5</button>
                    <button class="calc-btn" data-value="6">6</button>
                    <button class="calc-btn calc-operator" data-value="-">−</button>
                    
                    <button class="calc-btn" data-value="1">1</button>
                    <button class="calc-btn" data-value="2">2</button>
                    <button class="calc-btn" data-value="3">3</button>
                    <button class="calc-btn calc-operator" data-value="+">+</button>
                    
                    <button class="calc-btn" data-value="0">0</button>
                    <button class="calc-btn" data-value=".">.</button>
                    <button class="calc-btn calc-equals" data-value="=">=</button>
                    
                    <!-- Conversion Section -->
                    <div class="conversion-section">
                        <h3>Unit Conversion</h3>
                        <div class="conversion-controls">
                            <input type="number" class="conversion-input" placeholder="Enter value" step="any">
                            <select class="conversion-from">
                                <option value="cm">Centimeters</option>
                                <option value="in">Inches</option>
                                <option value="m">Meters</option>
                                <option value="ft">Feet</option>
                                <option value="km">Kilometers</option>
                                <option value="mi">Miles</option>
                            </select>
                            <span>=</span>
                            <input type="number" class="conversion-output" readonly>
                            <select class="conversion-to">
                                <option value="in">Inches</option>
                                <option value="cm">Centimeters</option>
                                <option value="m">Meters</option>
                                <option value="ft">Feet</option>
                                <option value="km">Kilometers</option>
                                <option value="mi">Miles</option>
                            </select>
                            <button class="btn-primary convert-btn">Convert</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Todo List Tab -->
        <div id="todoTab" class="tab-content">
            <div class="todo-container">
                <div class="todo-header">
                    <h2>Todo List</h2>
                    <button id="addTodoBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Todo
                    </button>
                </div>
                <div id="todoList" class="todo-list">
                    <!-- Todos will be dynamically inserted here -->
                    <div class="empty-state">
                        <i class="fas fa-tasks fa-3x"></i>
                        <h3>No todos yet</h3>
                        <p>Click "Add Todo" to create your first task</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add New Bookmark</h2>
                <form id="bookmarkForm">
                    <input type="hidden" id="editIndex">
                    <div class="form-group">
                        <label for="url">Website URL:</label>
                        <input type="url" id="url" placeholder="https://example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="title">Title (optional):</label>
                        <input type="text" id="title" placeholder="Website Title">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save Bookmark</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <h2><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h2>
                <p>Are you sure you want to delete this bookmark?</p>
                <p>This action cannot be undone.</p>
                <div class="form-actions">
                    <button type="button" id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
