<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-bookmark"></i> Bookmark Manager</h1>
            <p>Organize your favorite websites with beautiful cards</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button id="addBtn" class="btn-primary">
                <i class="fas fa-plus"></i> Add New Bookmark
            </button>
            
            <div class="pagination-controls">
                <label for="itemsPerPage">Items per page:</label>
                <select id="itemsPerPage">
                    <option value="4">4</option>
                    <option value="8" selected>8</option>
                    <option value="12">12</option>
                    <option value="16">16</option>
                </select>
                
                <div class="pagination">
                    <button id="prevPage" class="btn-secondary"><i class="fas fa-chevron-left"></i></button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button id="nextPage" class="btn-secondary"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- Cards Container -->
        <div id="cardsContainer" class="cards-container">
            <!-- Cards will be dynamically inserted here -->
        </div>

        <!-- Add/Edit Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add New Bookmark</h2>
                <form id="bookmarkForm">
                    <input type="hidden" id="editIndex">
                    <div class="form-group">
                        <label for="url">Website URL:</label>
                        <input type="url" id="url" placeholder="https://example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="title">Title (optional):</label>
                        <input type="text" id="title" placeholder="Website Title">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save Bookmark</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <h2><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h2>
                <p>Are you sure you want to delete this bookmark?</p>
                <p>This action cannot be undone.</p>
                <div class="form-actions">
                    <button type="button" id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
